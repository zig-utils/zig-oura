name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1441+d5181a9c9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun test ./test
      - run: git diff --exit-code -- bindings/wasm-bytes.ts dist
      - run: mkdir -p release && bun pm pack --destination release
      - name: Create release and attach the portable package
        uses: stacksjs/action-releaser@v1.2.9
        with:
          changelog: CHANGELOG.md
          files: release/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Zig source to Pantry
        uses: pantry-pm/pantry/packages/action@cd73113a2c27fb9194660cb9986d56d2e46f8cd1
        with:
          version: 0.11.133
          publish: zig
          install: 'false'
        env:
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
